[workspace]
# zenoh-wasm/ has its own workspace; without this its crates would become members of this one.
exclude = ["zenoh-wasm"]

# Rust zenoh in the browser (community port: github.com/0x53A/zenoh, branch `wasm`), running the
# same workload as bench/bench.c. bench/build-rust.sh clones that branch into ./zenoh-wasm.

[package]
name = "zenoh-rust-bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The port's SharedArrayBuffer worker pool (needs nightly, build-std and threads.toml).
threads = ["zenoh-runtime/wasm-threads"]

[dependencies]
zenoh = { path = "zenoh-wasm/zenoh", default-features = false, features = ["transport_ws"] }
zenoh-runtime = { path = "zenoh-wasm/commons/zenoh-runtime" }
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# As in the port's own examples: keep tokio's "net" (mio) out of the wasm32 build.
[dependencies.tokio]
version = "1"
default-features = false
features = ["sync", "macros", "rt"]

[dependencies.tokio-util]
version = "0.7"
default-features = false
features = ["rt"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
